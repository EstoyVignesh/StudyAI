services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: studyai-backend-qa
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studyai-qa-db
          property: connectionString
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080         # 7 days

  # ── Frontend Static Site ───────────────────────────────────────────────────
  - type: web
    name: studyai-frontend-qa
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: studyai-backend-qa
          type: web
          property: host
          envVarKey: VITE_API_URL

databases:
  - name: studyai-qa-db
    plan: free
    region: singapore
    databaseName: studyai_qa
    user: studyai
